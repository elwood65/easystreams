<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Definiții gradient pentru fundal și text pentru un aspect premium -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>
  </defs>

  <!-- Fundal rotund negru cu margine albastră -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)" stroke="url(#blueGradient)" stroke-width="8"/>

  <!-- Grupul textului inițialelor E S -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="110">
    
    <!-- Litera E (Albastru aprins) -->
    <text x="95" y="165" fill="#00a8ff">E</text>
    
    <!-- Litera S (Alb sau Gri foarte deschis pentru contrast) -->
    <text x="165" y="165" fill="#f0f0f0">S</text>
  </g>
  
  <!-- Element decorativ de streaming (o undă subtilă albastră deasupra literelor) -->
  <path d="M 100 65 Q 128 45 156 65" fill="none" stroke="#00a8ff" stroke-width="6" stroke-linecap="round"/>
</svg>
